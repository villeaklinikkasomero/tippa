# Render Blueprint: Tippa staattisena sivustona.
# Render lukee tämän tiedoston, kun luot palvelun kohdasta New > Blueprint.
services:
  - type: web
    name: tippa
    runtime: static
    buildCommand: echo "Ei build-vaihetta"
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: false
    headers:
      # Tietoturva: vain omat tiedostot, ei ulkoisia skriptejä, fontteja tai seurantaa
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # Välimuisti: sovelluksen tiedostot tarkistetaan aina, fontit ja ikonit pitkään
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /icons/*
        name: Cache-Control
        value: public, max-age=604800
